<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Upload Service</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 700px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .service-status {
            background: #f0f7ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 30px;
            border-radius: 4px;
            font-size: 13px;
        }

        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-healthy {
            background: #10b981;
        }

        .status-unhealthy {
            background: #ef4444;
        }

        .upload-area {
            border: 2px dashed #ddd;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .upload-area:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .upload-area.drag-over {
            border-color: #667eea;
            background: #f0f7ff;
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .upload-text {
            color: #333;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .upload-hint {
            color: #999;
            font-size: 13px;
        }

        .file-input {
            display: none;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
            box-shadow: none;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .document-list {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid #eee;
        }

        .document-list h3 {
            margin-bottom: 20px;
            color: #333;
            font-size: 16px;
        }

        .document-item {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: start;
        }

        .document-info {
            flex: 1;
        }

        .document-name {
            color: #333;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .document-meta {
            color: #666;
            font-size: 12px;
            display: flex;
            gap: 15px;
        }

        .document-id {
            font-family: 'Courier New', monospace;
            color: #667eea;
            font-size: 11px;
            background: white;
            padding: 2px 6px;
            border-radius: 3px;
        }

        .document-version {
            display: inline-block;
            background: #e0e7ff;
            color: #667eea;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 600;
        }

        .alert {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 13px;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert-success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .alert-info {
            background: #dbeafe;
            color: #0c2d6b;
            border: 1px solid #bfdbfe;
        }

        .loading {
            text-align: center;
            padding: 20px;
            display: none;
        }

        .spinner {
            border: 3px solid #f0f0f0;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 8px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            margin-bottom: 20px;
        }

        .modal-header h2 {
            color: #333;
            font-size: 20px;
        }

        .modal-body {
            margin-bottom: 20px;
        }

        .document-detail {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 13px;
        }

        .document-detail-label {
            color: #666;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .document-detail-value {
            color: #333;
            word-break: break-all;
        }

        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .copy-btn {
            padding: 6px 12px;
            font-size: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .copy-btn:hover {
            background: #5568d3;
        }

        .content-preview {
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            color: #333;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>📄 Document Upload Service</h1>
            <p>Upload, extract, and store policy documents</p>
        </div>

        <!-- Service Status -->
        <div class="service-status">
            <span class="status-indicator status-healthy" id="statusIndicator"></span>
            <span id="statusText">Connecting to service...</span>
        </div>

        <!-- Alerts -->
        <div id="alertContainer"></div>

        <!-- Upload Form -->
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📤</div>
            <div class="upload-text">Click to upload or drag and drop</div>
            <div class="upload-hint">Supported: PDF, DOC, DOCX, TXT (Max 50MB)</div>
            <input type="file" id="fileInput" class="file-input" accept=".pdf,.doc,.docx,.txt">
        </div>

        <!-- Loading Indicator -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 10px; color: #666;">Uploading and extracting...</p>
        </div>

        <!-- Button Group -->
        <div class="button-group">
            <button class="btn-primary" id="uploadBtn">Upload Document</button>
            <button class="btn-secondary" id="refreshBtn">Refresh List</button>
            <button class="btn-secondary" onclick="window.location.href='/approval'" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white;">✓ Go to Approval</button>
        </div>

        <!-- Document List -->
        <div class="document-list">
            <h3>Uploaded Documents</h3>
            <div id="documentListContainer"></div>
        </div>
    </div>

    <!-- Detail Modal -->
    <div class="modal" id="detailModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Document Details</h2>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeModal()">Close</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api/v1';

        // Show alert message
        function showAlert(message, type = 'info') {
            const container = document.getElementById('alertContainer');
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type} show`;
            alertDiv.textContent = message;
            container.appendChild(alertDiv);
            
            setTimeout(() => {
                alertDiv.remove();
            }, 5000);
        }

        // Check service health
        async function checkServiceHealth() {
            try {
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();
                
                if (data.success && data.data.database.status === 'healthy') {
                    document.getElementById('statusIndicator').className = 'status-indicator status-healthy';
                    document.getElementById('statusText').textContent = 'Service healthy - Ready to upload';
                    return true;
                } else {
                    document.getElementById('statusIndicator').className = 'status-indicator status-unhealthy';
                    document.getElementById('statusText').textContent = 'Service unavailable';
                    return false;
                }
            } catch (error) {
                document.getElementById('statusIndicator').className = 'status-indicator status-unhealthy';
                document.getElementById('statusText').textContent = 'Cannot connect to service';
                return false;
            }
        }

        // Handle file selection
        document.getElementById('fileInput').addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                uploadFile(e.target.files[0]);
            }
        });

        // Upload area drag and drop
        const uploadArea = document.getElementById('uploadArea');
        uploadArea.addEventListener('click', () => {
            document.getElementById('fileInput').click();
        });

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('drag-over');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('drag-over');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('drag-over');
            if (e.dataTransfer.files.length > 0) {
                uploadFile(e.dataTransfer.files[0]);
            }
        });

        // Upload file
        async function uploadFile(file) {
            // Validate file type
            const allowed = ['pdf', 'doc', 'docx', 'txt'];
            const ext = file.name.split('.').pop().toLowerCase();
            
            if (!allowed.includes(ext)) {
                showAlert(`Invalid file type. Allowed: ${allowed.join(', ')}`, 'error');
                return;
            }

            // Validate file size (50MB)
            if (file.size > 52428800) {
                showAlert('File too large. Maximum size: 50MB', 'error');
                return;
            }

            document.getElementById('loading').style.display = 'block';
            
            try {
                const formData = new FormData();
                formData.append('file', file);

                const response = await fetch(`${API_BASE}/upload`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                document.getElementById('loading').style.display = 'none';

                if (data.success) {
                    const doc = data.data;
                    showAlert(`✓ Document uploaded successfully!\nID: ${doc.document_id}`, 'success');
                    document.getElementById('fileInput').value = '';
                    await loadDocuments();
                } else {
                    showAlert(`Upload failed: ${data.error}`, 'error');
                }
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                showAlert(`Error: ${error.message}`, 'error');
            }
        }

        // Load documents
        async function loadDocuments() {
            try {
                const response = await fetch(`${API_BASE}/documents?limit=20&skip=0`);
                const data = await response.json();

                const container = document.getElementById('documentListContainer');
                
                if (!data.success || data.data.documents.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">📭</div>
                            <p>No documents uploaded yet</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = data.data.documents.map(doc => `
                    <div class="document-item">
                        <div class="document-info">
                            <div class="document-name">${escapeHtml(doc.filename)}</div>
                            <div class="document-meta">
                                <span><strong>Size:</strong> ${formatBytes(doc.file_size)}</span>
                                <span><strong>Lines:</strong> ${doc.stats.lines}</span>
                                <span><strong>Words:</strong> ${doc.stats.words}</span>
                                <span class="document-version">v${doc.version}</span>
                            </div>
                            <div class="document-meta" style="margin-top: 8px;">
                                <span class="document-id">${doc.document_id}</span>
                            </div>
                        </div>
                        <button class="btn-secondary" style="padding: 6px 12px; margin-left: 10px;" onclick="viewDocument('${doc.document_id}')">View</button>
                    </div>
                `).join('');
            } catch (error) {
                showAlert(`Error loading documents: ${error.message}`, 'error');
            }
        }

        // View document details
        async function viewDocument(docId) {
            try {
                const response = await fetch(`${API_BASE}/documents/${docId}`);
                const data = response.json();

                if (!response.ok) {
                    showAlert('Document not found', 'error');
                    return;
                }

                const doc = (await data).data;
                
                document.getElementById('modalTitle').textContent = `${doc.filename} (v${doc.version})`;
                document.getElementById('modalBody').innerHTML = `
                    <div class="document-detail">
                        <div class="document-detail-label">Document ID:</div>
                        <div class="document-detail-value" style="display: flex; justify-content: space-between; align-items: center;">
                            <span>${doc.document_id}</span>
                            <button class="copy-btn" onclick="copyToClipboard('${doc.document_id}')">Copy</button>
                        </div>
                    </div>
                    
                    <div class="document-detail">
                        <div class="document-detail-label">File Type:</div>
                        <div class="document-detail-value">${doc.file_type.toUpperCase()}</div>
                    </div>
                    
                    <div class="document-detail">
                        <div class="document-detail-label">File Size:</div>
                        <div class="document-detail-value">${formatBytes(doc.file_size)}</div>
                    </div>
                    
                    <div class="document-detail">
                        <div class="document-detail-label">Created:</div>
                        <div class="document-detail-value">${new Date(doc.created_at).toLocaleString()}</div>
                    </div>
                    
                    <div class="document-detail">
                        <div class="document-detail-label">Statistics:</div>
                        <div class="document-detail-value">
                            Lines: ${doc.stats.lines} | Words: ${doc.stats.words} | Characters: ${doc.stats.characters}
                        </div>
                    </div>
                    
                    <div class="document-detail">
                        <div class="document-detail-label">Content Preview:</div>
                        <div class="content-preview">${escapeHtml(doc.content_preview)}</div>
                    </div>
                `;
                
                document.getElementById('detailModal').classList.add('show');
            } catch (error) {
                showAlert(`Error: ${error.message}`, 'error');
            }
        }

        // Close modal
        function closeModal() {
            document.getElementById('detailModal').classList.remove('show');
        }

        // Utility functions
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showAlert('Copied to clipboard', 'success');
            });
        }

        // Event listeners
        document.getElementById('uploadBtn').addEventListener('click', () => {
            document.getElementById('fileInput').click();
        });

        document.getElementById('refreshBtn').addEventListener('click', loadDocuments);

        // Close modal on outside click
        window.addEventListener('click', (e) => {
            const modal = document.getElementById('detailModal');
            if (e.target === modal) {
                closeModal();
            }
        });

        // Initialize
        async function init() {
            const isHealthy = await checkServiceHealth();
            if (isHealthy) {
                await loadDocuments();
            } else {
                showAlert('Service is not available. Please start the service.', 'error');
            }
        }

        init();
    </script>
</body>
</html>
