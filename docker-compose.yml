version: '3.8'

services:
  # OPA (Open Policy Agent) - Policy Evaluation Engine
  opa:
    image: openpolicyagent/opa:latest
    container_name: docupolicy-opa
    ports:
      - "8181:8181"
    volumes:
      - ./opa_bundles:/bundles:ro
      - ./opa_config:/etc/opa
    environment:
      - OPA_LOG_LEVEL=info
    command: >
      run 
      --server 
      --bundle /bundles
      --log-level info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - docupolicy-net
    restart: unless-stopped

  # Stage 11 Enforcement API Server
  enforcement-api:
    build:
      context: .
      dockerfile: Dockerfile.enforcement
    container_name: docupolicy-enforcement
    ports:
      - "8000:8000"
    depends_on:
      opa:
        condition: service_healthy
    environment:
      - OPA_URL=http://opa:8181
      - SYS_PASSKEY=1234
      - LOG_LEVEL=INFO
      - PYTHON_UNBUFFERED=1
    volumes:
      - ./opa_bundles:/app/opa_bundles:ro
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - docupolicy-net
    restart: unless-stopped
    command: uvicorn stage11_enforcement_api:app --host 0.0.0.0 --port 8000

  # MongoDB for audit logs (optional, can be removed if not using)
  mongodb:
    image: mongo:latest
    container_name: docupolicy-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: docupolicy
    volumes:
      - mongodb_data:/data/db
    networks:
      - docupolicy-net
    restart: unless-stopped

networks:
  docupolicy-net:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
